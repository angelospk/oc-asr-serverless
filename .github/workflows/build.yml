name: build-and-push
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      adapter_revision:
        description: 'Full 40-char HF commit sha of the adapter to bake in'
        required: false
        default: '1a03f207e7e9bf46253715234a91eee98fa40505'
      image_tag:
        description: 'Extra tag for the image (v1, v2, ...)'
        required: false
        default: 'v2'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # The build downloads the ~3GB base model and writes a ~6GB merged model,
      # which can blow past the runner's free disk. Reclaim space first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            ADAPTER_REVISION=${{ inputs.adapter_revision || '1a03f207e7e9bf46253715234a91eee98fa40505' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/oc-asr-serverless:latest
            ghcr.io/${{ github.repository_owner }}/oc-asr-serverless:${{ inputs.image_tag || 'v2' }}

      # Deploy by digest, not by tag. A tag can be moved onto different bits;
      # a digest names one image forever.
      - name: Print image digest
        run: |
          echo "DIGEST=${{ steps.build.outputs.digest }}"
          echo "deploy: ghcr.io/${{ github.repository_owner }}/oc-asr-serverless@${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
